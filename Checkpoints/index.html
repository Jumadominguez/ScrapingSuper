<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Comparador de Precios</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
  .category-dropdown {
    position: relative;
  }
  .category-menu {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: white;
    border: 1px solid #dee2e6;
    border-radius: 0.375rem;
    box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
    max-height: 400px;
    overflow-y: auto;
    z-index: 1000;
    display: none;
  }
  .category-menu.show {
    display: block;
  }
  .category-item {
    padding: 0.5rem 1rem;
    cursor: pointer;
    border-bottom: 1px solid #f8f9fa;
  }
  .category-item:hover {
    background-color: #f8f9fa;
  }
  .category-item.level-0 {
    font-weight: bold;
    background-color: #e9ecef;
  }
  .category-item.level-1 {
    padding-left: 2rem;
    font-weight: 500;
  }
  </style>
</head>
<body class="bg-light">
  <div class="container my-5">
    <h2 class="mb-4">🛒 Comparador de Precios entre Supermercados</h2>
    <div class="container mb-4">
      <h5>📋 Cargá tus productos para comparar</h5>
      <div class="row g-2 mb-2">
        <div class="col-md-4">
          <div class="category-dropdown">
            <input type="text" class="form-control" id="producto" placeholder="Escribe un producto" autocomplete="off"
                   oninput="filterCategoryMenu()" onclick="showCategoryMenu()">
            <div class="category-menu" id="categoryMenu">
              <!-- Las categorías se cargarán aquí dinámicamente -->
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <input type="text" class="form-control" id="marca" placeholder="Marca (ej: Molinos Ala)">
        </div>
        <div class="col-md-4">
          <input type="text" class="form-control" id="presentacion" placeholder="Presentación (ej: 1kg)">
        </div>
      </div>
      <button type="button" class="btn btn-success mb-3" onclick="agregarProducto()">➕ Agregar producto</button>
      <ul class="list-group mb-3" id="lista-productos"></ul>
      <button type="button" class="btn btn-primary" onclick="compararProductos()">🔍 Comparar productos</button>
    </div>
    <div class="container mt-5">
      <div id="resultados">
        <!-- tabla -->
      </div>
    </div>
  </div>
  <script src="js/load_db_desplegablePRODUCTO.js"></script>
  <script src="js/functions.js"></script>
</body>
</html>
